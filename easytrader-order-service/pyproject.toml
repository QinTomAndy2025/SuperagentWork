[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easytrader-order-service"
version = "0.1.0"
description = "Local order-dispatch intake and automated A-share order execution service built on easytrader."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "QinTomAndy2025" }]
keywords = ["easytrader", "a-share", "trading", "order", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# easytrader drives a Windows broker client through pywinauto, so keep the
# dependency Windows-only.  The service itself runs in paper mode anywhere.
live = ["easytrader==0.23.7; sys_platform == 'win32'"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
easytrader-service = "easytrader_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easytrader_service = ["templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070b16" />
    <title>WebRTC 手机 · 设备</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="landing">
      <div class="brand landing-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="13" height="12" rx="3" />
            <path d="m16 10 4-2v8l-4-2" />
          </svg>
        </span>
        <span>WebRTC 手机 · 设备</span>
      </div>

      <h1>选择你的入口</h1>
      <p class="landing-copy">手机用户与设备用户使用不同的页面和账号体系，添加联系人后需双方确认。</p>

      <div class="landing-cards">
        <a class="landing-card" href="/phone">
          <span class="landing-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="7" y="2" width="10" height="20" rx="3" />
              <path d="M11 18h2" />
            </svg>
          </span>
          <h2>手机用户</h2>
          <p>手机号注册 / 登录，横屏通话</p>
          <span class="landing-go">进入手机页面 →</span>
        </a>

        <a class="landing-card" href="/device">
          <span class="landing-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="14" rx="2" />
              <path d="M8 21h8M12 18v3" />
            </svg>
          </span>
          <h2>设备用户</h2>
          <p>注册即分配 12 位设备号，适配 Pad 横竖屏</p>
          <span class="landing-go">进入设备页面 →</span>
        </a>
      </div>

      <p class="landing-foot">同一局域网 / 内网 · 首次使用需在浏览器信任自签名证书</p>
    </main>
  </body>
</html>
